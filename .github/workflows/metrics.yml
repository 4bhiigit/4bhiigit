name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day — the "auto update / daily refresh"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: 4bhiigit
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          style_css: "svg { border: 1.5px solid #D4AF37 !important; border-radius: 12px !important; background-color: #0D1117 !important; } .field svg { fill: #D4AF37 !important; } text.title { fill: #D4AF37 !important; }"
