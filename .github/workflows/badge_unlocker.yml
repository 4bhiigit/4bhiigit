name: Auto Badge Unlocker

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write

jobs:
  unlock-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Update code-prectice Repo Description
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.repos.update({
                owner: '4bhiigit',
                repo: 'code-prectice',
                description: '⚡ My personal DSA playground & LeetCode solution index built for technical interviews.'
              });
              console.log('Successfully updated code-prectice description!');
            } catch (err) {
              console.log('Note on updating repo description:', err.message);
            }
