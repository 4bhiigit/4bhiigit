<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 215" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" />
      <stop offset="60%" stop-color="#12100B" />
      <stop offset="100%" stop-color="#1A150A" />
    </linearGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F7E8BA" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Ambient Gold Glow for Cards -->
    <radialGradient id="cardGlow1" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cardGlow2" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#FFB700" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Left Card: Current Focus -->
  <g transform="translate(0, 0)">
    <!-- Outer Card Rectangle -->
    <rect width="410" height="215" rx="14" fill="url(#cardBg)" stroke="#D4AF37" stroke-width="1.8" stroke-opacity="0.9"/>
    <!-- Background Ambient Glow -->
    <rect width="410" height="215" rx="14" fill="url(#cardGlow1)"/>
    
    <!-- Title -->
    <text x="24" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="url(#goldTitle)">🎯  Current Focus</text>
    
    <!-- Decorative Divider Line -->
    <line x1="24" y1="56" x2="386" y2="56" stroke="#302713" stroke-width="1"/>

    <!-- Content Items -->
    <!-- Item 1 -->
    <text x="24" y="88" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">⚡ Full-Stack Engineering</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B949E">Next.js • React • Node.js • FastAPI</text>

    <!-- Item 2 -->
    <text x="24" y="136" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">📊 Data Analytics &amp; BI</text>
    <text x="24" y="154" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B949E">Python • SQL • Power BI • Query Optimization</text>

    <!-- Item 3 -->
    <text x="24" y="184" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">🤖 Applied AI Systems</text>
    <text x="24" y="202" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B949E">Voice Chatbots • Gemini API • Agentic AI</text>
  </g>

  <!-- Right Card: Vision & Goals -->
  <g transform="translate(440, 0)">
    <!-- Outer Card Rectangle -->
    <rect width="410" height="215" rx="14" fill="url(#cardBg)" stroke="#D4AF37" stroke-width="1.8" stroke-opacity="0.9"/>
    <!-- Background Ambient Glow -->
    <rect width="410" height="215" rx="14" fill="url(#cardGlow2)"/>
    
    <!-- Title -->
    <text x="24" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="url(#goldTitle)">🚀  Vision &amp; Goals</text>
    
    <!-- Decorative Divider Line -->
    <line x1="24" y1="56" x2="386" y2="56" stroke="#302713" stroke-width="1"/>

    <!-- Content Items -->
    <!-- Item 1 -->
    <text x="24" y="88" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">🛠️ Product Engineering</text>
    <text x="24" y="106" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B949E">Building data-driven software that ships</text>

    <!-- Item 2 -->
    <text x="24" y="136" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">🌐 Open Source Tooling</text>
    <text x="24" y="154" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B949E">Contributing to real-world developer tools</text>

    <!-- Item 3 -->
    <text x="24" y="184" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">💡 System Architecture</text>
    <text x="24" y="202" font-family="'Inter', sans-serif" font-weight="400" font-size="12" fill="#8B949E">Crafting clean, scalable end-to-end systems</text>
  </g>
</svg>
